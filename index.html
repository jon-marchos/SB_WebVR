<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js WebVR Viewer</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;

            font-family: Helvetica, Arial, sans-serif;
        }

        canvas {
            display: block;
        }


        /* --------------------------------
           MODE SWITCH
        -------------------------------- */

        #mode-switch {
            position: fixed;

            right: 24px;
            bottom: 24px;

            display: flex;

            padding: 4px;

            border-radius: 10px;

            background: rgba(25, 25, 25, 0.55);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            z-index: 1000;
        }


        .mode-button {
            font-family: Helvetica, Arial, sans-serif;

            font-size: 11px;
            font-weight: 500;

            letter-spacing: 0.7px;

            padding: 10px 14px;

            border: none;
            border-radius: 7px;

            background: transparent;

            color: rgba(255, 255, 255, 0.6);

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .mode-button:hover {
            color: white;
        }


        .mode-button.active {
            background: rgba(255, 255, 255, 0.18);
            color: white;
        }


        /* --------------------------------
           VR BUTTON CONTAINER
        -------------------------------- */

        #vr-button-container {
            position: fixed;

            right: 24px;
            bottom: 80px;

            z-index: 999;

            display: none;
        }

    </style>


    <!-- Three.js import map -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

</head>


<body>

    <!-- Desktop / Quest Toggle -->

    <div id="mode-switch">

        <button
            id="desktop-button"
            class="mode-button active"
        >
            DESKTOP
        </button>


        <button
            id="quest-button"
            class="mode-button"
        >
            META QUEST
        </button>

    </div>


    <!-- Three.js VR Button will be inserted here -->

    <div id="vr-button-container"></div>


    <!-- Main JavaScript -->

    <script
        type="module"
        src="./js/app.js"
    ></script>

</body>

</html>
