<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GLB WebVR Viewer</title>


    <style>

        /* ====================================================
           PAGE
        ==================================================== */

        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                Helvetica,
                Arial,
                sans-serif;
        }


        canvas {

            display: block;

        }



        /* ====================================================
           UPLOAD BUTTON
        ==================================================== */

        #upload-container {

            position: fixed;

            left: 24px;
            bottom: 24px;

            z-index: 1000;

        }


        #upload-button {

            font-family:
                Helvetica,
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.7px;

            padding: 12px 18px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            background:
                rgba(25, 25, 25, 0.55);

            color: white;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            cursor: pointer;

            transition:
                background 0.2s ease;

        }


        #upload-button:hover {

            background:
                rgba(255, 255, 255, 0.18);

        }



        /* Hide actual browser file input */

        #file-input {

            display: none;

        }



        /* ====================================================
           FILE NAME
        ==================================================== */

        #file-name {

            position: fixed;

            left: 24px;
            bottom: 76px;

            padding: 8px 12px;

            border-radius: 8px;

            background:
                rgba(25, 25, 25, 0.55);

            color:
                rgba(255, 255, 255, 0.75);

            font-size: 11px;

            letter-spacing: 0.4px;

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            display: none;

            z-index: 1000;

        }



        /* ====================================================
           MODE SWITCH
        ==================================================== */

        #mode-switch {

            position: fixed;

            right: 24px;
            bottom: 24px;

            display: flex;

            padding: 4px;

            border-radius: 10px;

            background:
                rgba(25, 25, 25, 0.55);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            z-index: 1000;

        }



        /* ====================================================
           MODE BUTTON
        ==================================================== */

        .mode-button {

            font-family:
                Helvetica,
                Arial,
                sans-serif;

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 0.7px;

            padding: 10px 14px;

            border: none;

            border-radius: 7px;

            background: transparent;

            color:
                rgba(255, 255, 255, 0.6);

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;

        }


        .mode-button:hover {

            color: white;

        }


        .mode-button.active {

            background:
                rgba(255, 255, 255, 0.18);

            color: white;

        }



        /* ====================================================
           VR BUTTON
        ==================================================== */

        #vr-button-container {

            position: fixed;

            right: 24px;

            bottom: 80px;

            z-index: 999;

            display: none;

        }



        /* ====================================================
           START MESSAGE
        ==================================================== */

        #start-message {

            position: fixed;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            text-align: center;

            color:
                rgba(255, 255, 255, 0.65);

            font-size: 13px;

            letter-spacing: 0.5px;

            pointer-events: none;

            z-index: 100;

        }


        #start-message strong {

            color: white;

            font-weight: 500;

        }

    </style>



    <!-- ======================================================
         THREE.JS IMPORT MAP
    ======================================================= -->

    <script type="importmap">

    {
        "imports": {

            "three":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

            "three/addons/":
            "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

        }
    }

    </script>

</head>



<body>


    <!-- ======================================================
         START MESSAGE
    ======================================================= -->

    <div id="start-message">

        <strong>NO MODEL LOADED</strong>

        <br><br>

        Select a GLB file to begin.

    </div>



    <!-- ======================================================
         FILE NAME
    ======================================================= -->

    <div id="file-name"></div>



    <!-- ======================================================
         FILE UPLOAD
    ======================================================= -->

    <div id="upload-container">

        <input
            type="file"
            id="file-input"
            accept=".glb"
        >


        <button id="upload-button">

            UPLOAD GLB

        </button>

    </div>



    <!-- ======================================================
         DESKTOP / QUEST SWITCH
    ======================================================= -->

    <div id="mode-switch">


        <button
            id="desktop-button"
            class="mode-button active"
        >

            DESKTOP

        </button>


        <button
            id="quest-button"
            class="mode-button"
        >

            META QUEST

        </button>


    </div>



    <!-- ======================================================
         WEBXR BUTTON
    ======================================================= -->

    <div id="vr-button-container"></div>



    <!-- ======================================================
         APP
    ======================================================= -->

    <script
        type="module"
        src="./js/app.js"
    ></script>


</body>

</html>
